<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe — Add tile</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ECECE8}
a{color:#1E1E1E}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #ECECE8; color: #1E1E1E; font-family: 'IBM Plex Sans', sans-serif">

<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="height: 68px; background: #F7F7F5; border-bottom: 1.5px solid #CFCFCA"></div>
<div style="flex: 1; display: flex">
<div style="width: 232px; background: #F7F7F5; border-right: 1.5px solid #CFCFCA"></div>
<div style="flex: 1; padding: 62px 28px 28px"><div style="height: 100%; border-radius: 24px; background: #F7F7F5; border: 1.5px solid #CFCFCA"></div></div>
<div style="width: 380px; background: #F7F7F5; border-left: 1.5px solid #CFCFCA"></div>
</div>
</div>
<div style="position: absolute; inset: 0; background: rgba(30,30,30,0.45)"></div>

<section role="dialog" aria-label="Add a tile" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1180px; height: 800px; box-sizing: border-box; border-radius: 32px; background: #F7F7F5; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">Add a tile</h1>
<a href="WfLayoutEditor.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #CFCFCA; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px">×</a>
</div>

<div style="display: flex; gap: 16px; align-items: center">
<label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search tiles</span><input type="search" placeholder="Search tiles" style="flex: 1; padding: 14px 18px; border-radius: 14px; border: 1.5px solid #8E8E88; background: #FFFFFF; font: inherit; font-size: 16px"></label>
<div style="display: flex; gap: 8px">
<button style="padding: 12px 18px; border-radius: 999px; background: #1E1E1E; color: #F7F7F5; border: 0; font: inherit; font-size: 15px">All</button>
<button style="padding: 12px 18px; border-radius: 999px; background: transparent; border: 1.5px solid #8E8E88; font: inherit; font-size: 15px">Content</button>
<button style="padding: 12px 18px; border-radius: 999px; background: transparent; border: 1.5px solid #8E8E88; font: inherit; font-size: 15px">Projects</button>
<button style="padding: 12px 18px; border-radius: 999px; background: transparent; border: 1.5px solid #8E8E88; font: inherit; font-size: 15px">Embeds</button>
</div>
</div>

<div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 14px; min-height: 0">
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Hero</span><span style="font-size: 13px; color: #6B6B66">Name, tagline, stickers · 3×2</span></button>
<button style="border-radius: 20px; border: 3px solid #2B44FF; background: #FFFFFF; padding: 16.5px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Project</span><span style="font-size: 13px; color: #6B6B66">Pulls from Projects · 1×1 to 2×2</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Text</span><span style="font-size: 13px; color: #6B6B66">Heading + paragraph · any</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Photo / video</span><span style="font-size: 13px; color: #6B6B66">From Media · any</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Now</span><span style="font-size: 13px; color: #6B6B66">What you're working on · 2×1</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Marquee</span><span style="font-size: 13px; color: #6B6B66">Scrolling words · 3×1</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Links</span><span style="font-size: 13px; color: #6B6B66">Email, GitHub, LinkedIn · 1×2</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Blog feed</span><span style="font-size: 13px; color: #6B6B66">Latest N posts · 2×2</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Timeline</span><span style="font-size: 13px; color: #6B6B66">Awards, contests, schools · 2×2</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">GitHub activity</span><span style="font-size: 13px; color: #6B6B66">Live from GitHub API · 2×1</span></button>
<button style="border-radius: 20px; border: 1.5px solid #8E8E88; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; background: #E6E6E2"></span><span style="font-weight: 600; font-size: 17px">Now playing</span><span style="font-size: 13px; color: #6B6B66">Spotify embed · 1×1</span></button>
<button style="border-radius: 20px; border: 1.5px dashed #8E8E88; background: transparent; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit"><span style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px dashed #8E8E88"></span><span style="font-weight: 600; font-size: 17px">Custom embed</span><span style="font-size: 13px; color: #6B6B66">Sandboxed HTML / iframe URL</span></button>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1.5px solid #CFCFCA">
<span style="font-size: 15px; color: #6B6B66; padding-top: 14px">Selected: Project → drops into the first empty 2×1 slot</span>
<div style="display: flex; gap: 10px; padding-top: 14px">
<a href="WfLayoutEditor.html" style="padding: 14px 22px; border-radius: 12px; border: 1.5px solid #8E8E88; text-decoration: none; font-weight: 600">Cancel</a>
<a href="WfLayoutEditor.html" style="padding: 14px 22px; border-radius: 12px; background: #2B44FF; color: #FFFFFF; text-decoration: none; font-weight: 600">Add to grid</a>
</div>
</div>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
